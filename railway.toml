[build]
builder = "DOCKERFILE"

[[services]]
name = "backend"
source = "backend/MultiMind.API"
dockerfile = "backend/MultiMind.API/Dockerfile"

[services.deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "frontend"
source = "frontend"
dockerfile = "frontend/Dockerfile"

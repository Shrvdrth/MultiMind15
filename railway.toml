[build]
builder = "DOCKERFILE"

[[services]]
name = "backend"
source = "backend/MultiMind.API"
dockerfile = "backend/MultiMind.API/Dockerfile"

[services.deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "frontend"
source = "frontend"
dockerfile = "frontend/Dockerfile"

[services.build]
# VITE_API_BASE_URL must be set in Railway dashboard → frontend service → Variables
# e.g. https://your-backend.up.railway.app/api

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: multimind-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=multimind;Username=postgres;Password=$(DB_PASSWORD)"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multimind-secrets
                  key: db-password
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: multimind-secrets
                  key: jwt-key
            - name: Jwt__Issuer
              value: MultiMind
            - name: Jwt__Audience
              value: MultiMindUsers
            - name: Jwt__ExpiryMinutes
              value: "60"
            - name: OpenAI__ApiKey
              valueFrom:
                secretKeyRef:
                  name: multimind-secrets
                  key: openai-api-key
            - name: OpenAI__Model
              value: openai/gpt-4o
            - name: OpenAI__BaseUrl
              value: https://openrouter.ai/api/v1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080

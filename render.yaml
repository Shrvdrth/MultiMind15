# Render Blueprint for the MultiMind API (free Docker web service).
# Create it in Render: New → Blueprint → pick this repo.
# Values marked "sync: false" are secrets. Render asks for them once, when the
# Blueprint is first created. They are never stored in this file.
services:
  - type: web
    name: multimind-api
    runtime: docker
    plan: free
    # Paths below are relative to the repo root.
    rootDir: backend/MultiMind.API
    dockerfilePath: ./backend/MultiMind.API/Dockerfile
    dockerContext: ./backend/MultiMind.API
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Neon connection string. Use the direct (non-pooled) URL:
      # postgresql://user:password@host/dbname?sslmode=require
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Random 256-bit signing key, generated by Render.
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: MultiMind
      - key: Jwt__Audience
        value: MultiMindUsers
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: OpenAI__ApiKey
        sync: false
      - key: OpenAI__Model
        value: openrouter/free
      - key: OpenAI__BaseUrl
        value: https://openrouter.ai/api/v1
      # Your Vercel URL(s), comma-separated, no trailing slash.
      - key: Frontend__Url
        sync: false
      # The email you will register with. Only this account becomes Admin.
      - key: Admin__Email
        sync: false
      - key: UsageLimits__DebatesPerUserPerDay
        value: "2"
      - key: UsageLimits__DebatesPerSitePerDay
        value: "6"
      - key: UsageLimits__ChatMessagesPerUserPerDay
        value: "5"
      - key: UsageLimits__ChatMessagesPerSitePerDay
        value: "8"

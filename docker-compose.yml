services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multimind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/MultiMind.API
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=multimind;Username=postgres;Password=${DB_PASSWORD:-changeme}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MultiMind
      Jwt__Audience: MultiMindUsers
      Jwt__ExpiryMinutes: "60"
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL:-anthropic/claude-sonnet-4.5}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      Frontend__Url: http://localhost:3000
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
